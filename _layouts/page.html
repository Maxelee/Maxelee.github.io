---
layout: default
---
<div class="wrap{% unless page.wide %} wrap--prose{% endunless %} page-body">
  <header class="page-head">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="page-head__lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</div>
