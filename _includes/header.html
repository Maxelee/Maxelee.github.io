<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="/">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Site navigation">
      <ul class="site-nav__list" id="site-nav-list">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav-list">{% include icon.html name="menu" %}<span class="visually-hidden">Menu</span></button>
    <button class="theme-toggle" aria-label="Toggle color theme">{% include icon.html name="sun" %}{% include icon.html name="moon" %}</button>
  </div>
</header>
