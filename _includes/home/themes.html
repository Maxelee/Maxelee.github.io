<section class="section" id="research-themes">
  <div class="section__title">
    <h2>Research Themes</h2>
  </div>
  <div class="themes-grid">
    {% for theme in site.data.themes %}
    <div class="theme-card">
      <h3>{{ theme.title }}</h3>
      <p>{{ theme.text }}</p>
    </div>
    {% endfor %}
  </div>
</section>
